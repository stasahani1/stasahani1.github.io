    var KEY = 'gaed:site';
    var root = document.documentElement;
    var gate = document.querySelector('[data-gate]');
    var form = document.querySelector('[data-gate-form]');
    var input = document.querySelector('[data-gate-input]');
    var msg = document.querySelector('[data-gate-msg]');
    function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
    function decrypt(pw) {
      var te = new TextEncoder();
      return crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey'])
        .then(function (base) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
        .then(function (k) { window.NYE_KEY = k; return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.data)); })
        .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
    }
    function store(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }
    function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function open(bundle, animate) {
      var go = function () {
        gate.remove();
        document.body.insertAdjacentHTML('beforeend', bundle.html);
        var s = document.createElement('script'); s.textContent = bundle.js; document.body.appendChild(s);
        root.classList.remove('gate-checking');
      };
      if (animate) { gate.classList.add('is-leaving'); setTimeout(go, 650); } else go();
    }
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'Please open this link in an up-to-date browser.'; return; }
    var pw = saved();
    if (pw) {
      root.classList.add('gate-checking');
      decrypt(pw).then(function (b) { open(b, false); }, function () { store(null); root.classList.remove('gate-checking'); });
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = input.value.trim(); if (!v) return;
      msg.textContent = 'Opening…'; input.classList.remove('is-wrong');
      decrypt(v).then(function (b) {
        store(v); // always remembered on this device
        open(b, true);
      }, function () {
        msg.textContent = 'That’s not quite it — try again.';
        void input.offsetWidth; input.classList.add('is-wrong'); input.select();
