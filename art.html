<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art - Anastasia Ahani</title>
    <style>
        body {
            background-color: #2d4a2b;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #1a2e1a;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.7;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            align-items: start;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .gallery img:hover {
            opacity: 0.85;
        }

        .gallery img.wide {
            grid-column: span 2;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 6px;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
            .gallery img.wide {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="art.html">Art</a>
        <a href="cv.html">CV</a>
        <a href="blog.html">Blog</a>
    </nav>

    <div class="container">
        <h1>Art</h1>
        <div class="gallery">
            <img src="art/IMG_0046.jpg" alt="Art" onclick="openLightbox(this)">
            <img src="art/IMG_2224.jpg" alt="Art" onclick="openLightbox(this)">
            <img src="art/IMG_8564.jpg" alt="Art" onclick="openLightbox(this)">
            <img src="art/IMG_1969.jpg" alt="Art" class="wide" onclick="openLightbox(this)">
            <img src="art/IMG_4363.jpg" alt="Art" onclick="openLightbox(this)">
            <img src="art/IMG_5539.jpg" alt="Art" class="wide" onclick="openLightbox(this)">
            <img src="art/IMG_8500.jpg" alt="Art" onclick="openLightbox(this)">
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        function openLightbox(img) {
            document.getElementById('lightbox-img').src = img.src;
            document.getElementById('lightbox').classList.add('open');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    </script>
</body>
</html>
