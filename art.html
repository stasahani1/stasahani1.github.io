    <style>
        body { background: var(--forest-700); }
        .page-head p { max-width: 46ch; margin-top: 44px; color: var(--cream-dim); font-size: 20px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-flow: dense;
            gap: clamp(12px, 1.6vw, 22px);
            padding: 0 var(--gutter) clamp(80px, 10vw, 140px);
            align-items: start;
        }
        .gallery figure { cursor: zoom-in; }
        .gallery figure.wide { grid-column: span 2; }
        .gallery .frame {
            overflow: hidden;
            border-radius: 6px;
            transition: transform 0.6s var(--ease), box-shadow 0.6s var(--ease);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }
        .gallery figure:hover .frame { box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45); }
        .gallery img {
            width: 100%;
            height: auto;
            background: var(--forest-900);
            transition: transform 1.1s var(--ease), filter 0.6s;
        }
        .gallery figure:hover img { transform: scale(1.04); }
        .gallery figcaption {
            display: flex;
            justify-content: space-between;
            padding-top: 10px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--cream-dim);
        }
        @media (max-width: 800px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) {
            .gallery { grid-template-columns: 1fr; }
            .gallery figure.wide { grid-column: auto; }
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: grid;
            place-items: center;
            background: rgba(8, 18, 10, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--ease);
        }
        .lightbox.open { opacity: 1; pointer-events: auto; }
        .lightbox img {
            max-width: min(92vw, 1400px);
            max-height: 84vh;
            width: auto; height: auto;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
        }
        .lightbox.open img { view-transition-name: art-open; }
        .lb-bar {
            position: absolute;
            left: var(--gutter); right: var(--gutter); bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .lb-bar button, .lb-close {
            background: none;
            border: 1px solid var(--cream-faint);
            color: var(--cream);
            font: inherit;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        .lb-bar button:hover, .lb-close:hover { background: var(--cream); color: var(--ink); }
        .lb-close {
            position: absolute;
            top: 18px; right: var(--gutter);
            font-family: var(--mono);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        ::view-transition-group(art-open) { animation-duration: 0.5s; animation-timing-function: var(--ease); }
    </style>

    <script src="assets/site.js" defer></script>
    <script>
        const thumbs = [...document.querySelectorAll(".gallery img")];
        const lb = document.getElementById("lightbox");
        const lbImg = document.getElementById("lb-img");
        const count = document.getElementById("lb-count");
        let current = -1;

        // Animate with the View Transitions API where supported, plain fade otherwise
        const transition = fn => {
            if (!document.startViewTransition) return fn();
            document.documentElement.classList.add("vt-local");
            const vt = document.startViewTransition(fn);
            vt.finished.finally(() => document.documentElement.classList.remove("vt-local"));
            return vt;
        };

        function show(i) {
            current = (i + thumbs.length) % thumbs.length;
            const t = thumbs[current];
            lbImg.src = t.src;          // small version shows instantly...
            lbImg.alt = t.alt;
            const full = new Image();   // ...then swaps to full resolution once loaded
            full.onload = () => { if (thumbs[current] === t) lbImg.src = t.dataset.full; };
            full.src = t.dataset.full;
            count.textContent = `${String(current + 1).padStart(2, "0")} / ${String(thumbs.length).padStart(2, "0")}`;
        }
        function open(i) {
            thumbs[i].style.viewTransitionName = "art-open";
            transition(() => {
                thumbs[i].style.viewTransitionName = "";
                show(i);
                lb.classList.add("open");
            });
            document.body.style.overflow = "hidden";
        }
        function close() {
            if (current < 0) return;
            const t = thumbs[current];
            transition(() => {
                lb.classList.remove("open");
                t.style.viewTransitionName = "art-open";
            })?.finished?.then(() => { t.style.viewTransitionName = ""; });
            document.body.style.overflow = "";
            current = -1;
        }

        thumbs.forEach((t, i) => t.closest("figure").addEventListener("click", () => open(i)));
        document.getElementById("lb-prev").onclick = e => { e.stopPropagation(); show(current - 1); };
        document.getElementById("lb-next").onclick = e => { e.stopPropagation(); show(current + 1); };
        document.getElementById("lb-close").onclick = close;
        lb.addEventListener("click", e => { if (e.target === lb) close(); });
        document.addEventListener("keydown", e => {
            if (current < 0) return;
            if (e.key === "Escape") close();
            if (e.key === "ArrowRight") show(current + 1);
            if (e.key === "ArrowLeft") show(current - 1);
        });
        let sx = null;
        lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
        lb.addEventListener("touchend", e => {
            if (sx === null) return;
            const dx = e.changedTouches[0].clientX - sx;
            if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
            sx = null;
        });
    </script>
